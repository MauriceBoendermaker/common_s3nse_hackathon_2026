[package]
name = "private_credit"
version = "0.1.0"
description = "Private Credit - on-chain Groth16 underwriting verification and SPL escrow settlement"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "private_credit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.0.2"
anchor-spl = "1.0.2"
groth16-solana = "0.2.0"
solana-poseidon = "5.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
